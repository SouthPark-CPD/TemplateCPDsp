<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CPD // Procédures</title>

<link
  rel="icon"
  type="image/png"
  href="Seal_of_the_Chicago_Police_Department.png">

<style>

  :root{
    --bg:#0b0f14;
    --bg-panel:#11161d;
    --bg-panel-2:#151b23;
    --bg-dark:#0c1015;
    --line:#232b35;
    --steel:#4a6fa5;
    --steel-dim:#2c3d54;
    --gold:#c9a227;
    --gold-dim:#725d16;
    --text:#dfe4e8;
    --text-dim:#7c8894;
    --amber:#e0a13a;
    --red:#c94b4b;
    --green:#4caf6f;

    --font-display:'Oswald','Arial Narrow',sans-serif;
    --font-mono:'IBM Plex Mono','Consolas',monospace;
  }


  *{
    box-sizing:border-box;
  }


  html{
    scroll-behavior:smooth;
  }


  html,
  body{
    margin:0;
    padding:0;
  }


  body{
    background:
      radial-gradient(
        circle at 15% 0%,
        rgba(74,111,165,0.10),
        transparent 40%
      ),
      radial-gradient(
        circle at 100% 100%,
        rgba(201,162,39,0.06),
        transparent 45%
      ),
      var(--bg);

    color:var(--text);

    font-family:var(--font-mono);

    min-height:100vh;

    padding-bottom:60px;

    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
  }


  .search-box,
  input,
  textarea{
    -webkit-user-select:text;
    -moz-user-select:text;
    -ms-user-select:text;
    user-select:text;
  }


  /* ==========================================================
     SEARCH
  ========================================================== */

  .search-container{
    position:relative;

    max-width:1100px;

    margin:24px auto 0;

    padding:0 32px;
  }


  .search-box{
    width:100%;

    background:var(--bg-dark);

    border:1px solid var(--steel-dim);

    color:var(--text);

    padding:15px 18px;

    font-family:var(--font-mono);

    font-size:13px;

    outline:none;

    transition:border-color .15s;
  }


  .search-box:focus{
    border-color:var(--gold);
  }


  .search-box::placeholder{
    color:var(--text-dim);
  }


  /* ==========================================================
     NAVIGATION — CATÉGORIES INTERNES
  ========================================================== */

  nav{
    max-width:1100px;

    margin:22px auto 0;

    padding:0 32px;

    display:flex;

    gap:2px;

    flex-wrap:wrap;
  }


  nav button{
    font-family:var(--font-display);

    background:var(--bg-panel);

    border:1px solid var(--line);

    color:var(--text-dim);

    padding:12px 17px;

    font-size:12px;

    letter-spacing:1.2px;

    text-transform:uppercase;

    cursor:pointer;

    transition:all .15s;
  }


  nav button:hover{
    color:var(--text);

    border-color:var(--steel-dim);
  }


  nav button.active{
    color:var(--gold);

    background:var(--bg-panel-2);

    border-color:var(--steel-dim);
  }


  /* ==========================================================
     MAIN
  ========================================================== */

  main{
    max-width:1100px;

    margin:0 auto;

    padding:0 32px;
  }


  .panel{
    background:var(--bg-panel-2);

    border:1px solid var(--steel-dim);

    border-top:2px solid var(--gold);

    margin-top:0;
  }


  .panel-head{
    padding:28px;

    border-bottom:1px solid var(--line);
  }


  .panel-title{
    font-family:var(--font-display);

    font-size:22px;

    letter-spacing:1.5px;

    text-transform:uppercase;

    color:var(--text);
  }


  .panel-desc{
    font-size:12px;

    color:var(--text-dim);

    margin-top:7px;

    line-height:1.6;
  }


  .article-count{
    margin-top:12px;

    font-size:10px;

    color:var(--amber);

    letter-spacing:1px;
  }


  /* ==========================================================
     PROCÉDURES
  ========================================================== */

  .Procédures{
    padding:12px 28px 28px;
  }


  .Procedure{
    border:1px solid var(--line);

    background:var(--bg-dark);

    margin-top:14px;

    transition:
      border-color .15s,
      transform .15s,
      background .15s;
  }


  .Procedure:hover{
    border-color:var(--steel-dim);

    background:#0e141b;

    transform:translateY(-1px);
  }


  .Procedure-header{
    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:15px;

    padding:15px 18px;

    border-bottom:1px solid var(--line);

    background:rgba(74,111,165,0.04);
  }


  .Procedure-number{
    color:var(--gold);

    font-size:11px;

    letter-spacing:1px;

    min-width:65px;
  }


  .Procedure-title{
    flex:1;

    font-family:var(--font-display);

    font-size:15px;

    letter-spacing:1px;

    text-transform:uppercase;

    color:var(--text);
  }


  .Procedure-type{
    font-size:9px;

    letter-spacing:1px;

    padding:5px 8px;

    border:1px solid;

    white-space:nowrap;

    color:var(--steel);

    border-color:var(--steel);
  }


  .Procedure-body{
    padding:18px;

    font-size:12px;

    line-height:1.75;

    color:var(--text);
  }


  .Procedure-body p{
    margin:0 0 12px;
  }


  .Procedure-body p:last-child{
    margin-bottom:0;
  }


  /* ==========================================================
     BUTTONS
  ========================================================== */

  .Procedure-actions{
    display:flex;

    gap:8px;

    flex-wrap:wrap;

    margin-top:16px;
  }


  .Procedure-button{
    display:inline-block;

    padding:10px 15px;

    border:1px solid var(--steel);

    background:transparent;

    color:var(--steel);

    font-family:var(--font-mono);

    font-size:10.5px;

    letter-spacing:1px;

    text-transform:uppercase;

    text-decoration:none;

    cursor:pointer;

    transition:all .15s;
  }


  .Procedure-button:hover{
    background:var(--steel);

    color:#0b0f14;
  }


  .Procedure-button.gold{
    border-color:var(--gold);

    color:var(--gold);
  }


  .Procedure-button.gold:hover{
    background:var(--gold);

    color:#0b0f14;
  }


  .Procedure-button.green{
    border-color:var(--green);

    color:var(--green);
  }


  .Procedure-button.green:hover{
    background:var(--green);

    color:#0b0f14;
  }


  /* ==========================================================
     NOTICE
  ========================================================== */

  .notice{
    border-left:3px solid var(--gold);

    background:rgba(201,162,39,0.05);

    padding:14px 16px;

    margin:15px 0;
  }


  .notice.blue{
    border-left-color:var(--steel);

    background:rgba(74,111,165,0.05);
  }


  .notice.green{
    border-left-color:var(--green);

    background:rgba(76,175,111,0.05);
  }


  .notice-title{
    color:var(--gold);

    font-family:var(--font-display);

    letter-spacing:1px;

    text-transform:uppercase;

    font-size:12px;

    margin-bottom:5px;
  }


  .notice.blue .notice-title{
    color:var(--steel);
  }


  .notice.green .notice-title{
    color:var(--green);
  }


  /* ==========================================================
     FOOTER
  ========================================================== */

  footer{
    max-width:1100px;

    margin:0 auto;

    padding:20px 32px 0;

    font-size:10.5px;

    color:var(--text-dim);

    letter-spacing:1px;

    text-align:center;
  }


  /* ==========================================================
     MOBILE
  ========================================================== */

  @media(max-width:700px){

    main{
      padding:0 16px;
    }


    nav{
      padding:0 16px;
    }


    .search-container{
      padding:0 16px;
    }


    .panel-head{
      padding:20px;
    }


    .Procédures{
      padding:10px 15px 20px;
    }


    .Procedure-header{
      align-items:flex-start;

      flex-wrap:wrap;
    }


    .Procedure-number{
      min-width:auto;
    }


    .Procedure-type{
      order:3;

      width:100%;

      text-align:center;
    }


    .Procedure-body{
      font-size:11.5px;
    }


    .Procedure-actions{
      flex-direction:column;
    }


    .Procedure-button{
      width:100%;

      text-align:center;
    }

  }

</style>

<link rel="stylesheet" href="mdt-v5.css">

</head>


<body>


<!-- ==========================================================
     HEADER GLOBAL
     Généré par nav.js
========================================================== -->

<div id="site-header"></div>



<!-- ==========================================================
     RECHERCHE
========================================================== -->

<div class="search-container">

  <input
    type="text"
    id="search"
    class="search-box"
    placeholder="⌕ Rechercher une procédure : arrestation, rapport, contrôle, amende..."
    autocomplete="off">

</div>



<!-- ==========================================================
     CATÉGORIES
========================================================== -->

<nav id="categories"></nav>



<!-- ==========================================================
     MAIN
========================================================== -->

<main>

  <div class="panel">


    <div class="panel-head">

      <div
        class="panel-title"
        id="panel-title">

        Procédures générales

      </div>


      <div
        class="panel-desc"
        id="panel-desc">

        Documents et modèles opérationnels destinés aux membres du Chicago Police Department.

      </div>


      <div
        class="article-count"
        id="article-count">

        00 Procédures

      </div>

    </div>



    <div
      class="Procédures"
      id="Procédures"></div>


  </div>

</main>



<!-- ==========================================================
     FOOTER
========================================================== -->

<footer>

  SYSTÈME INTERNE DU CPD — PROCÉDURES OPÉRATIONNELLES —
  USAGE INTERNE UNIQUEMENT — NE PAS DIFFUSER

</footer>



<!-- ==========================================================
     CONFIGURATION DE CETTE PAGE
========================================================== -->

<script>

const PAGE_CONFIG = {

  subtitle:
    "Procédures opérationnelles — Manuel CPD",

  currentPage:
    "index.html",

  docCode:
    "CPD-TPL-001",

  version:
    "1.0"

};

</script>



<!-- ==========================================================
     NAVIGATION GLOBALE
========================================================== -->

<script src="nav-v5.js?v=tablet1"></script>



<!-- ==========================================================
     JAVASCRIPT DE LA PAGE
========================================================== -->

<script>


/* ==========================================================
   DONNÉES

   Chargées dynamiquement depuis data.js.
========================================================== */

let categories = [];



/* ==========================================================
   VARIABLE
========================================================== */

let currentCategory = "general";



/* ==========================================================
   CHARGEMENT DES DONNÉES
========================================================== */

async function loadData(){

  try{

    const response =
      await fetch(
        "data.js?_=" + Date.now()
      );


    const text =
      await response.text();


    /*
       data.js définit CPD_DATA.
    */

    const script =
      document.createElement("script");


    script.textContent =
      text;


    document.head.appendChild(script);


    categories =
      window.CPD_DATA || [];


    render();

  }catch(err){

    console.error(
      "Erreur de chargement de data.js :",
      err
    );


    document
      .getElementById("Procédures")
      .innerHTML = `

        <div class="notice">

          <div class="notice-title">
            Erreur de chargement
          </div>

          Impossible de charger les données
          (data.js). Vérifiez que le site est bien
          hébergé en ligne (http/https) et non ouvert
          en local.

        </div>

      `;

  }

}



/* ==========================================================
   CATÉGORIES
========================================================== */

function renderCategories(){

  const nav =
    document.getElementById(
      "categories"
    );


  nav.innerHTML = "";


  categories.forEach(category => {

    const button =
      document.createElement(
        "button"
      );


    button.textContent =
      category.label;


    if(
      category.id ===
      currentCategory
    ){

      button.classList.add(
        "active"
      );

    }


    button.onclick = () => {

      currentCategory =
        category.id;


      document
        .getElementById("search")
        .value = "";


      render();


      window.scrollTo({

        top:
          document
            .querySelector("nav")
            .offsetTop - 10,

        behavior:"smooth"

      });

    };


    nav.appendChild(
      button
    );

  });

}



/* ==========================================================
   AFFICHAGE
========================================================== */

function render(){

  const category =
    categories.find(
      c =>
        c.id ===
        currentCategory
    );


  if(!category){

    return;

  }


  document
    .getElementById("panel-title")
    .textContent =
      category.label;


  document
    .getElementById("panel-desc")
    .textContent =
      category.desc;


  document
    .getElementById("article-count")
    .textContent =
      `${String(category.Procédures.length).padStart(2,"0")} Procédures`;


  renderProcédures(
    category.Procédures
  );


  renderCategories();

}



/* ==========================================================
   PROCÉDURES
========================================================== */

function renderProcédures(
  Procédures
){

  const container =
    document.getElementById(
      "Procédures"
    );


  container.innerHTML = "";


  if(
    Procédures.length === 0
  ){

    container.innerHTML = `

      <div class="notice">

        <div class="notice-title">
          Aucun résultat
        </div>

        Aucune procédure ne correspond
        à votre recherche.

      </div>

    `;

    return;

  }


  Procédures.forEach(
    Procedure => {

      const element =
        document.createElement(
          "article"
        );


      element.className =
        "Procedure";


      element.innerHTML = `

        <div class="Procedure-header">

          <div class="Procedure-number">

            TPL. ${Procedure.number}

          </div>


          <div class="Procedure-title">

            ${Procedure.title}

          </div>


          <div class="Procedure-type">

            ${Procedure.type}

          </div>

        </div>


        <div class="Procedure-body">

          <p>

            ${Procedure.description}

          </p>


          <div class="Procedure-actions">

            <a
              class="Procedure-button gold"
              href="${Procedure.file}">

              📄 Ouvrir la procédure

            </a>

          </div>

        </div>

      `;


      container.appendChild(
        element
      );

    }
  );

}



/* ==========================================================
   IMPRESSION
========================================================== */

function openPrint(file){

  const win =
    window.open(
      file,
      "_blank"
    );


  if(win){

    win.onload = () => {

      win.print();

    };

  }

}



/* ==========================================================
   RECHERCHE
========================================================== */

document
  .getElementById("search")
  .addEventListener(
    "input",
    function(){

      const query =
        this.value
          .toLowerCase()
          .trim();


      if(!query){

        render();

        return;

      }


      const results = [];


      categories.forEach(
        category => {

          category.Procédures.forEach(
            Procedure => {

              const searchable = (

                category.label +
                " " +
                category.desc +
                " " +
                Procedure.title +
                " " +
                Procedure.type +
                " " +
                Procedure.description

              ).toLowerCase();


              if(
                searchable.includes(
                  query
                )
              ){

                results.push(
                  Procedure
                );

              }

            }
          );

        }
      );


      document
        .getElementById(
          "panel-title"
        )
        .textContent =
          "Résultats de recherche";


      document
        .getElementById(
          "panel-desc"
        )
        .textContent =
          `Recherche globale : "${this.value}"`;


      document
        .getElementById(
          "article-count"
        )
        .textContent =
          `${String(results.length).padStart(2,"0")} RÉSULTAT(S)`;


      renderProcédures(
        results
      );

    }
  );



/* ==========================================================
   INITIALISATION
========================================================== */

loadData();



/* ==========================================================
   PROTECTION ANTI-COPIE
========================================================== */

document.addEventListener(
  "contextmenu",
  function(e){

    e.preventDefault();

  }
);


document.addEventListener(
  "keydown",
  function(e){

    const key =
      e.key.toUpperCase();


    /*
       F12
    */

    if(key === "F12"){

      e.preventDefault();

      return;

    }


    /*
       Ctrl/Cmd + U, S, I, J
    */

    if(
      (e.ctrlKey || e.metaKey) &&
      ["U","S","I","J"].includes(key)
    ){

      e.preventDefault();

      return;

    }


    /*
       Ctrl/Cmd + Shift + I/J/C
    */

    if(
      (e.ctrlKey || e.metaKey) &&
      e.shiftKey &&
      ["I","J","C"].includes(key)
    ){

      e.preventDefault();

      return;

    }

  }
);


document.addEventListener(
  "dragstart",
  function(e){

    e.preventDefault();

  }
);


document.addEventListener(
  "copy",
  function(e){

    e.preventDefault();

  }
);

</script>


</body>

</html>
