<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDT — Chicago Police Department</title><link rel="icon" href="/assets/cpd-seal.png"><link rel="stylesheet" href="unified.css?v=6"><link rel="stylesheet" href="tablet-badges.css?v=1"></head>
<body>
  <main class="tablet-shell">
    <header class="tablet-status">
      <div><strong id="tablet-time">--:--</strong><span id="tablet-date">Chargement…</span></div>
      <div class="tablet-status-right"><span class="online-dot"></span><span>Web</span><span id="agent-name">Vérification…</span><a class="logout-button" href="/api/auth/logout" aria-label="Déconnexion">×</a></div>
    </header>
    <section id="launcher" class="launcher" aria-live="polite">
      <div class="launcher-intro"><p id="launcher-kicker">TABLETTE CPD</p><h1 id="launcher-title">Accueil</h1><span id="launcher-description">Ouvrez une application pour accéder à son portail.</span><button id="folder-back" class="folder-back" type="button" hidden>← Toutes les applications</button></div>
      <div id="app-grid" class="app-grid" aria-label="Applications disponibles"></div>
      <div id="shell-message" class="launcher-message" role="status">Chargement de vos accès…</div>
      <button id="retry-session" class="retry-button" type="button" hidden>Réessayer</button>
    </section>
    <section id="workspace" class="workspace" hidden>
      <header class="workspace-bar"><button id="home-button" class="home-button" type="button" aria-label="Retour à l’accueil">⌂</button><div><span id="section-name">MDT</span><h1 id="view-title">Chargement…</h1></div><a id="admin-link" class="admin-button" href="/admin" hidden>Administration</a></header>
      <div id="workspace-message" class="workspace-message" role="status">Chargement…</div>
      <iframe id="module-frame" title="MDT" hidden></iframe>
    </section>
  </main>
  <script src="unified-routes.js?v=6"></script><script src="unified.js?v=14"></script>
</body></html>
