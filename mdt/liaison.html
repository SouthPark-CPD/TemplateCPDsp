<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Dépôt de plainte — Liaison gouvernement</title>
  <link rel="stylesheet" href="/mdt/liaison.css?v=1">
  <style>.liaison-page{max-width:none;height:100vh;padding:22px 28px;display:flex;flex-direction:column;overflow:hidden}.liaison-head{margin-bottom:14px}.liaison-head h1{font-size:26px}.liaison-tabs{display:flex;gap:4px;margin-bottom:14px;border:1px solid #29405d;background:#0d1a2b;border-radius:12px;padding:4px;width:max-content}.tab{background:transparent;border:0;border-radius:8px;color:#9eb0c7;padding:9px 16px;cursor:pointer;font-weight:700}.tab.active{background:#e1b65b;color:#152033}.complaint-form,.forum-view{flex:1;min-height:0}.complaint-form[hidden],.forum-view[hidden]{display:none!important}.complaint-form{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:14px}.form-card{padding:18px;border-radius:14px}.form-card h2{font-size:14px;color:#e8c878}.forum-view{display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:12px}.list-toolbar{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:0 2px}.list-toolbar h2{font-size:16px;margin:0}.secondary{background:#172b43;border:1px solid #38506e;color:#dce8f6;padding:8px 12px;border-radius:9px;cursor:pointer}.threads{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:3px}.thread-card{background:#132238;border:1px solid #29405d;border-radius:11px;color:#edf3fb;text-align:left;padding:12px;cursor:pointer;min-height:62px}.thread-card:hover,.thread-card:focus{border-color:#e1b65b;outline:0}.thread-card strong,.thread-card span{display:block}.thread-card span{color:#9eb0c7;font-size:11px;margin-top:6px}.thread-detail{overflow:auto;background:#132238;border:1px solid #29405d;border-radius:14px;padding:18px;display:flex;flex-direction:column}.thread-detail h3{margin:4px 0;color:#e8c878}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid #29405d;padding-bottom:12px}.detail-kicker{color:#9eb0c7;font-size:10px;letter-spacing:.12em}.detail-state{color:#8ed3a4;font-size:11px}.messages{flex:1;overflow:auto}.message{border-top:1px solid #29405d;padding:10px 0}.message small{color:#9eb0c7;margin-left:8px}.message p{white-space:pre-wrap;font-size:13px}.thread-composer{border-top:1px solid #29405d;padding-top:12px;display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.thread-composer textarea{min-height:62px;resize:none}.composer-status{grid-column:1/-1;color:#9eb0c7;font-size:11px}.warning{color:#e7bb68;background:#312a19;border:1px solid #715a2d;border-radius:10px;padding:10px;font-size:12px}@media(max-width:800px){.liaison-page{height:auto;min-height:100vh;overflow:auto;padding:18px}.complaint-form{grid-template-columns:1fr}.forum-view{grid-template-columns:1fr;grid-template-rows:auto 210px minmax(260px,1fr)}} </style>
</style><style>.toolbar-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.toolbar-actions input,.toolbar-actions select{width:auto;min-width:120px;padding:8px 10px}.thread-card.unread{border-color:#e1b65b;box-shadow:inset 3px 0 #e1b65b}.thread-card i{font-style:normal;color:#e1b65b;margin-left:6px;font-weight:800}.detail-tags{color:#9eb0c7;font-size:11px;margin-top:6px}.detail-tools{display:flex;align-items:flex-end;gap:10px;padding:12px 0;border-bottom:1px solid #29405d}.detail-tools label{display:flex;flex-direction:column;gap:5px}.detail-tools select{min-width:180px;background:#0d1a2b;color:#edf3fb;border:1px solid #38506e;border-radius:8px;padding:7px}.detail-tools span{color:#8ed3a4;font-size:11px}.file-label{margin-top:14px}.file-label input{padding:8px}.file-label small{color:#9eb0c7;font-size:10px;font-weight:400}.attachment{display:block;color:#e1b65b;font-size:12px;margin-top:5px}.thread-composer input[type=file]{grid-column:1/-1;color:#9eb0c7;font-size:11px}.empty-state{color:#9eb0c7;text-align:center;padding:24px}</style></head>
<body>
  <main class="liaison-page">
    <header class="liaison-head">
      <div><p class="eyebrow">LIAISON GOUVERNEMENT</p><h1>Dépôt de plainte</h1><p class="intro">Créez un signalement complet. Il sera transmis automatiquement au forum gouvernemental pour suivi.</p></div>
      <div class="secure-pill">● Transmission sécurisée</div>
    </header>
    <div class="liaison-tabs"><button type="button" class="tab active" data-tab="new">Nouveau dépôt</button><button type="button" class="tab" data-tab="list">Dépôts du forum</button></div><form id="complaint-form" class="complaint-form" novalidate>
      <section class="form-card"><h2>Informations du dossier</h2><div class="form-grid">
        <label>Prénom du rédacteur<input name="authorFirstName" maxlength="80" required></label><label>Nom du rédacteur<input name="authorLastName" maxlength="80" required></label><label>Matricule du rédacteur<input name="authorBadge" maxlength="30" required></label><label>Objet du dépôt<input id="complaint-subject" name="subject" maxlength="120" placeholder="Ex. Vol de véhicule" required></label>
        <label>Nom du plaignant<input id="complaint-complainant" name="complainant" maxlength="120" placeholder="Nom RP / matricule"></label>
        <label>Date et heure<input id="complaint-date" name="date" type="datetime-local"></label>
        <label>Lieu des faits<input id="complaint-location" name="location" maxlength="180" placeholder="Adresse ou zone"></label>
        <label class="span-2">Personnes impliquées<input id="complaint-involved" name="involved" maxlength="500" placeholder="Noms, matricules ou descriptions"></label>
        <label class="span-2">Témoins<input id="complaint-witnesses" name="witnesses" maxlength="500" placeholder="Noms ou coordonnées (facultatif)"></label>
      </div></section>
      <section class="form-card"><h2>Récit des faits</h2><label>Description détaillée<textarea id="complaint-description" name="description" rows="8" maxlength="5000" placeholder="Décrivez les faits dans l'ordre chronologique…" required></textarea></label><label class="file-label">Pièces jointes<input id="complaint-attachments" type="file" multiple accept="image/*,.pdf,.txt,.doc,.docx"><small>3 fichiers maximum · 3 Mo par fichier</small></label><div class="form-foot"><span id="description-count">0 / 5000</span><button id="submit-complaint" class="primary" type="submit">Déposer la plainte</button></div></section>
    </form><section id="complaint-list" class="forum-view" hidden><div class="list-toolbar"><div><span class="detail-kicker">CENTRE DE SUIVI</span><h2>Dépôts de plainte <span id="thread-total"></span></h2></div><div class="toolbar-actions"><input id="thread-search" type="search" placeholder="Rechercher…"><select id="thread-status-filter"><option value="all">Tous les statuts</option><option value="active">Actifs</option><option value="archived">Archivés</option></select><select id="thread-tag-filter"><option value="all">Tous les tags</option></select><button id="refresh-complaints" class="secondary">Actualiser</button></div></div><div id="threads" class="threads"></div><article id="thread-detail" class="thread-detail" hidden></article></section>
    <div id="complaint-status" class="status" role="status" aria-live="polite" hidden></div>
  </main>
  <script src="/mdt/liaison.js?v=1"></script>
</body>
</html>
