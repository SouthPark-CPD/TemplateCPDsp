<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Dépôt de plainte — Liaison gouvernement</title>
  <link rel="stylesheet" href="/mdt/liaison.css?v=1">
  <style>.liaison-page{max-width:none;height:100vh;padding:22px 28px;display:flex;flex-direction:column}.liaison-head{margin-bottom:14px}.liaison-head h1{font-size:26px}.liaison-tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid #29405d}.tab{background:transparent;border:0;color:#9eb0c7;padding:10px 16px;cursor:pointer}.tab.active{color:#e1b65b;border-bottom:2px solid #e1b65b}.complaint-form,.forum-view{flex:1;min-height:0}.forum-view{display:grid;grid-template-columns:300px 1fr;gap:14px}.list-toolbar{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.list-toolbar h2{font-size:16px;margin:0}.secondary{background:#172b43;border:1px solid #38506e;color:#dce8f6;padding:8px 12px;border-radius:9px}.threads{overflow:auto;display:flex;flex-direction:column;gap:8px}.thread-card{background:#132238;border:1px solid #29405d;border-radius:11px;color:#edf3fb;text-align:left;padding:12px;cursor:pointer}.thread-card:hover{border-color:#e1b65b}.thread-card strong,.thread-card span{display:block}.thread-card span{color:#9eb0c7;font-size:11px;margin-top:6px}.thread-detail{overflow:auto;background:#132238;border:1px solid #29405d;border-radius:14px;padding:18px}.thread-detail h3{margin-top:0}.message{border-top:1px solid #29405d;padding:10px 0}.message small{color:#9eb0c7;margin-left:8px}.message p{white-space:pre-wrap;font-size:13px}.form-card{padding:16px}.form-foot{margin-top:8px}</style>
</head>
<body>
  <main class="liaison-page">
    <header class="liaison-head">
      <div><p class="eyebrow">LIAISON GOUVERNEMENT</p><h1>Dépôt de plainte</h1><p class="intro">Créez un signalement complet. Il sera transmis automatiquement au forum gouvernemental pour suivi.</p></div>
      <div class="secure-pill">● Transmission sécurisée</div>
    </header>
    <div class="liaison-tabs"><button type="button" class="tab active" data-tab="new">Nouveau dépôt</button><button type="button" class="tab" data-tab="list">Dépôts du forum</button></div><form id="complaint-form" class="complaint-form" novalidate>
      <section class="form-card"><h2>Informations du dossier</h2><div class="form-grid">
        <label>Prénom du rédacteur<input name="authorFirstName" maxlength="80" required></label><label>Nom du rédacteur<input name="authorLastName" maxlength="80" required></label><label>Matricule du rédacteur<input name="authorBadge" maxlength="30" required></label><label>Objet du dépôt<input id="complaint-subject" name="subject" maxlength="120" placeholder="Ex. Vol de véhicule" required></label>
        <label>Nom du plaignant<input id="complaint-complainant" name="complainant" maxlength="120" placeholder="Nom RP / matricule"></label>
        <label>Date et heure<input id="complaint-date" name="date" type="datetime-local"></label>
        <label>Lieu des faits<input id="complaint-location" name="location" maxlength="180" placeholder="Adresse ou zone"></label>
        <label class="span-2">Personnes impliquées<input id="complaint-involved" name="involved" maxlength="500" placeholder="Noms, matricules ou descriptions"></label>
        <label class="span-2">Témoins<input id="complaint-witnesses" name="witnesses" maxlength="500" placeholder="Noms ou coordonnées (facultatif)"></label>
      </div></section>
      <section class="form-card"><h2>Récit des faits</h2><label>Description détaillée<textarea id="complaint-description" name="description" rows="8" maxlength="5000" placeholder="Décrivez les faits dans l'ordre chronologique…" required></textarea></label><div class="form-foot"><span id="description-count">0 / 5000</span><button id="submit-complaint" class="primary" type="submit">Déposer la plainte</button></div></section>
    </form><section id="complaint-list" class="forum-view" hidden><div class="list-toolbar"><h2>Dépôts de plainte</h2><button id="refresh-complaints" class="secondary">Actualiser</button></div><div id="threads" class="threads"></div><article id="thread-detail" class="thread-detail" hidden></article></section>
    <div id="complaint-status" class="status" role="status" aria-live="polite" hidden></div>
  </main>
  <script src="/mdt/liaison.js?v=1"></script>
</body>
</html>
