<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Canal de liaison — CPD</title>
  <link rel="stylesheet" href="/mdt/channel.css?v=4">
  <link rel="stylesheet" href="/mdt/mentions.css?v=1">
</head>
<body data-channel-label="Canal de liaison">
  <main class="channel-page">
    <header class="channel-hero"><div class="channel-mark" aria-hidden="true">⌁</div><div class="channel-copy"><span class="eyebrow">LIAISON GOUVERNEMENT</span><h1>Canal de liaison</h1><p>Conversation Discord accessible directement depuis la tablette.</p></div><span class="channel-status"><i></i>Canal sécurisé</span></header>
    <section class="channel-layout">
      <div class="channel-toolbar"><div><span class="detail-kicker">CONVERSATION</span><h2 id="channel-name">Canal de liaison</h2><p id="channel-meta">Chargement du canal…</p></div><button id="channel-refresh" class="secondary" type="button"><span>↻</span> Actualiser</button></div>
      <div id="channel-messages" class="channel-messages" aria-live="polite"><p class="channel-placeholder">Chargement des messages…</p></div>
      <button id="channel-more" class="secondary more" type="button" hidden>Charger les messages précédents</button>
      <form id="channel-composer" class="channel-composer" novalidate>
        <div class="mention-picker" data-mention-picker><div class="mention-picker-head"><div><span class="detail-kicker">MENTIONS</span><strong>Notifier des membres</strong></div><span class="mention-count" data-mention-count>Aucun membre sélectionné</span></div><div class="mention-control"><input class="mention-search" data-mention-search type="search" autocomplete="off" placeholder="Rechercher un membre à notifier…"></div><div class="mention-selected" data-mention-selected></div><div class="mention-options" data-mention-options hidden></div><p class="mention-help" data-mention-help>Sélection facultative.</p></div>
        <label class="composer-field" for="channel-message"><span class="sr-only">Message</span><textarea id="channel-message" maxlength="1800" rows="2" placeholder="Écrire un message…"></textarea></label>
        <label class="channel-file" for="channel-files"><span>↥</span><span>Pièce jointe</span><input id="channel-files" type="file" multiple accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx,.zip"></label>
        <button id="channel-send" class="primary" type="submit"><span>➤</span> Envoyer</button><div id="channel-file-list" class="channel-file-list" aria-live="polite"></div><span id="channel-compose-status" class="compose-status" role="status" aria-live="polite"></span>
      </form>
    </section>
  </main>
  <script src="/mdt/mentions.js?v=1"></script><script src="/mdt/channel.js?v=8"></script>
</body>
</html>
