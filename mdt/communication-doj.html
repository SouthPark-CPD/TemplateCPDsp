<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Communication DOJ — CPD</title>
  <link rel="stylesheet" href="/mdt/channel.css?v=1">
</head>
<body data-channel-id="1489640064207032475" data-channel-label="Communication DOJ">
  <main class="channel-page">
    <header class="channel-hero">
      <div class="channel-mark" aria-hidden="true">✦</div>
      <div class="channel-copy">
        <span class="eyebrow">LIAISON GOUVERNEMENT</span>
        <h1>Communication DOJ</h1>
        <p>Échangez avec le Department of Justice directement depuis la tablette.</p>
      </div>
      <span class="channel-status"><i></i>Canal sécurisé</span>
    </header>
    <section class="channel-layout" aria-label="Discussion Communication DOJ">
      <div class="channel-toolbar">
        <div><span class="detail-kicker">CONVERSATION</span><h2 id="channel-name">Communication DOJ</h2><p id="channel-meta">Chargement du canal…</p></div>
        <button id="channel-refresh" class="secondary" type="button"><span aria-hidden="true">↻</span> Actualiser</button>
      </div>
      <div id="channel-messages" class="channel-messages" aria-live="polite"><p class="channel-placeholder">Chargement des messages…</p></div>
      <button id="channel-more" class="secondary more" type="button" hidden>Charger les messages précédents</button>
      <form id="channel-composer" class="channel-composer" novalidate>
        <label class="composer-field" for="channel-message"><span class="sr-only">Message</span><textarea id="channel-message" maxlength="1800" rows="2" placeholder="Écrire un message à la liaison DOJ…"></textarea></label>
        <label class="channel-file" for="channel-files"><span aria-hidden="true">↥</span><span>Pièce jointe</span><input id="channel-files" type="file" multiple accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx,.zip"></label>
        <button id="channel-send" class="primary" type="submit"><span aria-hidden="true">➤</span> Envoyer</button>
        <div id="channel-file-list" class="channel-file-list" aria-live="polite"></div>
        <span id="channel-compose-status" class="compose-status" role="status" aria-live="polite"></span>
      </form>
    </section>
  </main>
  <script src="/mdt/channel.js?v=1"></script>
</body>
</html>
