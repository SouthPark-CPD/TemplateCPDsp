<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPD // Guide radio</title>
<style>
  :root{
    --bg:#0b0f14;
    --bg-panel:#11161d;
    --bg-panel-2:#151b23;
    --line:#232b35;
    --steel:#4a6fa5;
    --steel-dim:#2c3d54;
    --gold:#c9a227;
    --text:#dfe4e8;
    --text-dim:#7c8894;
    --amber:#e0a13a;
    --red:#c0504a;
    --green:#4caf6f;
    --font-display:'Oswald', 'Arial Narrow', sans-serif;
    --font-mono:'IBM Plex Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(74,111,165,0.10), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(201,162,39,0.06), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-mono);
    min-height:100vh;
    padding:0 0 60px 0;
  }
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  header{
    position:relative;
    border-bottom:1px solid var(--line);
    padding:28px 32px 22px;
    overflow:hidden;
    background:linear-gradient(180deg, rgba(74,111,165,0.06), transparent);
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .badge-row{display:flex; align-items:center; justify-content:space-between; gap:18px; position:relative;}
  .badge-left{display:flex; align-items:center; gap:18px;}
  .star{width:52px; height:52px; flex:0 0 auto;}
  .brand-title{
    font-family:var(--font-display);
    font-size:24px;
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:600;
    color:var(--text);
    line-height:1.1;
  }
  .brand-sub{
    font-size:11px;
    letter-spacing:3px;
    color:var(--steel);
    text-transform:uppercase;
    margin-top:4px;
  }
  .back-link{
    font-family:var(--font-mono);
    font-size:11.5px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:10px 16px;
    border:1px solid var(--steel);
    color:var(--steel);
    text-decoration:none;
    white-space:nowrap;
    transition:all .15s;
    flex:0 0 auto;
  }
  .back-link:hover{background:var(--steel); color:#0b0f14;}

  .search-row{
    padding:20px 32px 0;
  }
  .search-box{
    width:100%;
    max-width:420px;
    background:var(--bg-panel-2);
    border:1px solid var(--steel-dim);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:13px;
    padding:12px 16px;
    letter-spacing:0.5px;
  }
  .search-box:focus{outline:none; border-color:var(--gold);}
  .search-box::placeholder{color:var(--text-dim);}

  main{padding:24px 32px 0;}

  .cat-block{margin-bottom:32px;}
  .cat-head{
    display:flex; align-items:center; gap:12px;
    margin-bottom:12px;
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }
  .cat-title{
    font-family:var(--font-display);
    font-size:17px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--gold);
  }
  .cat-count{
    font-size:10.5px;
    color:var(--text-dim);
    letter-spacing:1px;
    margin-left:auto;
  }

  .code-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:10px;
  }
  .code-card{
    background:var(--bg-panel-2);
    border:1px solid var(--line);
    border-left:3px solid var(--steel);
    padding:12px 14px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    transition:border-color .15s, background .15s;
  }
  .code-card:hover{border-left-color:var(--gold); background:#171e27;}
  .code-card.urgent{border-left-color:var(--red);}
  .code-tag{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:700;
    color:var(--gold);
    white-space:nowrap;
    min-width:52px;
  }
  .code-card.urgent .code-tag{color:var(--red);}
  .code-desc{
    font-size:12.5px;
    line-height:1.5;
    color:var(--text);
  }
  .code-card.hidden{display:none;}

  footer{
    padding:20px 32px 0;
    font-size:10.5px;
    color:var(--text-dim);
    letter-spacing:1px;
    text-align:center;
  }

  .empty-msg{
    display:none;
    color:var(--text-dim);
    font-size:13px;
    padding:20px 0;
  }

  @media (max-width:640px){
    header{padding:20px;}
    main{padding:20px 16px 0;}
    .search-row{padding:20px 16px 0;}
    .brand-title{font-size:19px;}
    .code-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="badge-row">
    <div class="badge-left">
      <svg class="star" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <path id="arc-top2" d="M 34 100 A 66 66 0 0 1 166 100" />
          <path id="arc-bottom2" d="M 47 128 A 60 60 0 0 0 153 128" />
          <path id="mini-star2" d="M0,-7 L1.76,-2.43 L6.66,-2.16 L2.85,0.93 L4.12,5.66 L0,3 L-4.12,5.66 L-2.85,0.93 L-6.66,-2.16 L-1.76,-2.43 Z" />
        </defs>
        <path d="M100,4 L123.5,67.6 L191.3,70.3 L138,112.4 L156.4,177.7 L100,140 L43.6,177.7 L62,112.4 L8.7,70.3 L76.5,67.6 Z"
          fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="100" cy="100" r="78" fill="#151b23" stroke="var(--gold)" stroke-width="2"/>
        <circle cx="100" cy="100" r="74" fill="none" stroke="var(--gold)" stroke-width="1"/>
        <circle cx="100" cy="100" r="55" fill="#0c1015" stroke="var(--gold)" stroke-width="1.5"/>
        <text font-family="Oswald, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="var(--gold)">
          <textPath href="#arc-top2" startOffset="50%" text-anchor="middle">CHICAGO</textPath>
        </text>
        <text font-family="Oswald, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="var(--gold)">
          <textPath href="#arc-bottom2" startOffset="50%" text-anchor="middle">POLICE</textPath>
        </text>
        <use href="#mini-star2" transform="translate(27,100) scale(1.1)" fill="var(--gold)"/>
        <use href="#mini-star2" transform="translate(173,100) scale(1.1)" fill="var(--gold)"/>
        <use href="#mini-star2" transform="translate(100,88) scale(2.4)" fill="var(--gold)" opacity="0.9"/>
        <rect x="64" y="116" width="72" height="17" rx="2" fill="var(--gold)"/>
        <text x="100" y="128" font-family="Oswald, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.5" text-anchor="middle" fill="#0c1015">URBS IN HORTO</text>
      </svg>
      <div>
        <div class="brand-title">Guide radio — CPD</div>
        <div class="brand-sub">Codes 10 &amp; procédures de communication</div>
      </div>
    </div>
    <a class="back-link" href="index.html">← Retour templates</a>
  </div>
</header>

<div class="search-row">
  <input type="text" class="search-box" id="search" placeholder="Rechercher un code ou un mot-clé (ex: 10-4, poursuite, blessé...)">
</div>

<main id="content"></main>

<div class="empty-msg" id="empty-msg">Aucun code ne correspond à ta recherche.</div>

<footer>CPD INTERNAL SYSTEM — USAGE ROLEPLAY UNIQUEMENT — NE PAS DIFFUSER HORS SERVEUR</footer>

<script>
const categories = [
  {
    title: "Statuts & accusés de réception",

      ["10-6", "Occupé / attendre avant de poursuivre sauf urgence"],
      ["10-7", "Hors service temporaire / indisponible pour appel"],
      ["10-8", "En service / disponible pour appel"],
      ["10-9", "Répéter le dernier message"],
      ["10-10", "Fin de service"],
      ["10-22", "Annuler ou ignorer"],
      ["10-23", "Standby / attente"],
      ["10-98", "Assignation terminée / fin du 10-97 / disponible pour appel"],
      ["10-99", "Officier en danger, a besoin d'aide en urgence (similaire Code 99)"],
    ]
  },
  {
    title: "Communication & renseignements",
    codes: [
      ["10-12", "Présence de visiteurs et peuvent entendre la radio"],
      ["10-13", "Veut connaître la météo ou les conditions routières"],

      ["10-24", "Demande une transmission de voiture à voiture (Dispatch présent)"],
      ["10-25", "Sujet recherché"],
      ["10-28", "Vérification immatriculation"],
      ["10-29", "Vérification mandats / dossier criminel"],
      ["10-35", "Demande de renfort sur position de l'officier (préciser rue, etc.)"],
    ]
  },
  {
    title: "Déplacements & interventions",
    codes: [
      ["10-17", "Ajout de carburant"],
      ["10-18", "En route vers... (préciser la localisation)"],
      ["10-19", "Retour au commissariat"],
      ["10-21", "Contactez-moi par téléphone"],
      ["10-23", "Standby / attente"],
      ["10-30", "Danger / précaution supplémentaire"],
      ["10-36", "Heure exacte"],
      ["10-37", "Cambriolage en cours"],
      ["10-38", "Contrôle routier / Traffic Stop"],
      ["10-40", "Accident (caractériser par défaut, préciser si blessure corpo)"],
      ["10-50", "Demande dépanneuse / Tow Truck"],
      ["10-51", "Demande ambulance / Paramedics"],
      ["10-56", "Refus d'obtempérer"],

  },
  {

    codes: [
      ["10-70", "Vente de drogue"],

      ["10-97", "Arrivé sur scène (couramment remplacé par le code 6)"],
    ]
  },
  {
    title: "Codes de priorité d'intervention",
    codes: [
      ["Code 1", "Répondez à votre radio"],
      ["Code 2", "Prioritaire – répondre sans sirène"],
      ["Code 3", "Urgent – répondre avec lumières et sirène"],
      ["Code 4", "Aucune autre assistance nécessaire, situation stable"],
      ["Code 4-Adam", "Idem, mais suspect toujours en fuite, les unités sont mobilisées"],
      ["Code 5", "En surveillance, autres unités doivent éviter le lieu"],
      ["Code 6", "Arrivé sur scène ou déjà occupé en intervention / investigation"],
      ["Code 6-Adam", "Arrivé, peut avoir besoin de l'assistance d'unités proches"],
      ["Code 6-Charles", "Idem, suspect dangereux (mandat), attente confirmation assistance"],
      ["Code 7", "Pause repas (requête, renseignement du lieu)"],
      ["Code 20", "Notifiez les médias ou soyez avisé que les médias sont sur les lieux"],
      ["Code 37", "Véhicule rapporté volé"],
      ["Code 99", "Officier en danger, a besoin d'aide en urgence (identique 11-99)"],
      ["Code 100", "Unités en position pour intercepter suspect en fuite"],
      ["Code Robert", "Requête pour déploiement fusil / carabine sur scène"],
      ["Code Sam", "Requête pour déploiement d'un Beanbag PG"],
    ]
  },
  {
    title: "Codes criminels",
    codes: [
      ["187", "Homicide"],
      ["207", "Kidnapping"],
      ["211", "Braquage de magasin"],
      ["212", "Braquage Banque"],
      ["240", "Agression"],
      ["374", "Plongée illégale"],
      ["415", "Trouble à l'ordre public"],
      ["417", "Individu armé"],
      ["459", "Cambriolage"],
      ["487", "Vol de véhicule"],
      ["502", "Conduite sous influence"],
      ["998", "Officier Involved Shooting"],
      ["999", "Identique Code-99"],
    ]
  },
  {
    title: "Numéro d'unité",
    codes: [
      ["Format", "Un chiffre + une lettre + un second chiffre, dans cet ordre. Le premier chiffre correspond à la Division ou au District de l'unité, la lettre à son type opérationnel, et le second chiffre à sa position parmi les autres unités du même secteur."],
      ["35", "Autoroute Freeway (totalité)"],
      ["17", "Los Santos [SUD]"],
      ["18", "Los Santos [NORD]"],
      ["16", "Secteur superviseur [NORD] et [SUD]"],
    ]
  },
  {
    title: "Types d'unités",
    codes: [
      ["A", "Deux Agents en patrouille véhiculée (\"Adam\")"],
      ["Air", "Aéronef (\"Air Unit\")"],
      ["B", "Unité Bateau (\"Bravo\")"],
      ["E", "Traffic Division (\"Edward\")"],
      ["F3", "Foot Beat (Foot Patrol – Patrouille à pied)"],
      ["K-9", "Patrouille avec un officier canin"],
      ["K", "Gang and Narcotics Division, Gang Section (\"King\")"],
      ["L", "Un Agent en patrouille véhiculée (\"Lincoln\"), aussi utilisé par les superviseurs"],
      ["M", "Motorcycle Unit (\"Mary\")"],
      ["C", "Cycle Unit"],
      ["O", "Événement spécial ou unité non-traditionnel (\"Queen\")"],
      ["SLO", "Senior Logistic Officer (SLO – SLO Lincoln) (SAM – SLO Adam)"],
      ["S", "Sierra, Investigation Division"],
      ["N", "Narcotics (\"Nora\")"],
      ["W", "Detective ID (\"William\")"],
      ["Y", "Gang and Narcotics Division, Narcotics Section (\"Young\")"],
    ]
  },
  {
    title: "Alphabet phonétique",
    codes: [
      ["A", "Adam"],
      ["B", "Boy"],
      ["C", "Charles"],
      ["D", "David"],
      ["E", "Edward"],
      ["F", "Frank"],
      ["G", "George"],
      ["H", "Henry"],
      ["I", "Ida"],
      ["J", "John"],
      ["K", "King"],
      ["L", "Lincoln"],
      ["M", "Mary"],
      ["N", "Nora"],
      ["O", "Ocean"],
      ["P", "Paul"],
      ["Q", "Queen"],
      ["R", "Robert"],
      ["S", "Sam"],
      ["T", "Tom"],
      ["U", "Union"],
      ["V", "Victor"],
      ["W", "William"],
      ["X", "X-Ray"],
      ["Y", "Young"],
      ["Z", "Zebra"],
    ]
  }
];

const urgentTitles = ["Urgences & priorités"];

function render(filter=""){
  const content = document.getElementById('content');
  content.innerHTML = '';
  const f = filter.trim().toLowerCase();
  let totalVisible = 0;

  categories.forEach(cat => {
    const isUrgentCat = urgentTitles.includes(cat.title);
    const matches = cat.codes.filter(([tag, desc]) =>
      !f || tag.toLowerCase().includes(f) || desc.toLowerCase().includes(f)
    );
    if(matches.length === 0) return;
    totalVisible += matches.length;

    const block = document.createElement('div');
    block.className = 'cat-block';
    block.innerHTML = `
      <div class="cat-head">
        <div class="cat-title">${cat.title}</div>
        <div class="cat-count">${matches.length} code${matches.length>1?'s':''}</div>
      </div>
      <div class="code-grid">
        ${matches.map(([tag, desc]) => `
          <div class="code-card${isUrgentCat ? ' urgent' : ''}">
            <div class="code-tag">${tag}</div>
            <div class="code-desc">${desc}</div>
          </div>
        `).join('')}
      </div>
    `;
    content.appendChild(block);
  });

  document.getElementById('empty-msg').style.display = totalVisible === 0 ? 'block' : 'none';
}

document.getElementById('search').addEventListener('input', (e) => render(e.target.value));

render();
</script>

</body>
</html>
