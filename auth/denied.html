<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accès refusé — CPD</title><link rel="icon" href="../assets/cpd-seal.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/portal.css"><link rel="stylesheet" href="login.css"></head><body><main class="login-shell"><a class="back" href="../">← Retour au portail</a><section class="login-panel"><img src="../assets/cpd-seal.png" alt="Sceau CPD"><p class="eyebrow">Contrôle d’accès</p><h1>Accès refusé</h1><p id="denied-message" class="explanation">Votre compte Discord ne possède pas le rôle requis pour accéder au MDT.</p><a class="discord-button" href="/api/auth/discord">Essayer avec un autre compte</a><div class="security-note"><span>Serveur requis</span><strong>Chicago Police Department</strong></div></section></main><script>const reason=new URLSearchParams(location.search).get("reason");const message=document.querySelector("#denied-message");if(reason==="server")message.textContent="Discord ne reconnaît pas ce compte comme membre du serveur Chicago Police Department.";if(reason==="discord"){document.querySelector("h1").textContent="Connexion interrompue";message.textContent="Discord n’a pas répondu correctement. Revenez à la connexion puis réessayez.";}</script></body></html>
